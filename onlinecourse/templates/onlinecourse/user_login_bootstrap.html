{% extends "onlinecourse/user_courses_bootstrap.html" %}
{% block content %}
<div class="container mt-4" style="max-width: 400px;">
  <h2>Login</h2>
  {% if message %}<div class="alert alert-danger">{{ message }}</div>{% endif %}
  <form method="post" action="{% url 'onlinecourse:login' %}">
    {% csrf_token %}
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" class="form-control" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="psw" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
</div>
{% endblock %}
