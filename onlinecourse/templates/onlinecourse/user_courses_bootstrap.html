<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Online Course{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <a class="navbar-brand" href="{% url 'onlinecourse:index' %}">OnlineCourse</a>
    <div class="ml-auto">
      {% if user.is_authenticated %}
        <span class="text-light mr-3">Hi, {{ user.username }}</span>
        <a href="{% url 'onlinecourse:logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
      {% else %}
        <a href="{% url 'onlinecourse:login' %}" class="btn btn-outline-light btn-sm">Login</a>
        <a href="{% url 'onlinecourse:registration' %}" class="btn btn-outline-light btn-sm">Register</a>
      {% endif %}
    </div>
  </nav>

  {% block content %}
  {% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
